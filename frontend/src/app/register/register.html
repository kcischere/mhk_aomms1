<div class="hero-panel">
    <div class="hero-logo">
        <span>🍳</span> mr. hungry <small style="font-weight:normal; opacity:0.8;">KITCHEN</small>
    </div>
    <div class="hero-content">
        <p>Join the family</p>
        <h1>Good food,<br>Great moments,<br>Happy memories!</h1>
    </div>
    <div class="hero-footer">
        COOKED WITH CARE • MR. HUNGRY KITCHEN
    </div>
</div>

<div class="form-panel">
    <div class="form-container">
        <h2>Create an account.</h2>
        <div class="subtitle">Join the kitchen for quick orders and special perks.</div>
        
        <form (ngSubmit)="onRegister()">
            <div class="form-group">
                <label for="name">Full Name</label>
                <input type="text" id="name" [(ngModel)]="name" name="name" required placeholder="Donmark Doe">
            </div>
            <div class="form-group">
                <label for="email">Email address</label>
                <input type="email" id="email" [(ngModel)]="email" name="email" required placeholder="name@example.com">
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" [(ngModel)]="password" name="password" required placeholder="••••••••••••">
            </div>
            <button type="submit" class="btn-submit">→ Create Account</button>
        </form>

        <div id="message" [style.color]="isSuccess ? 'green' : 'red'" *ngIf="message">
            {{ message }}
        </div>

        <div class="links-section">
            <div>Already have an account? <a routerLink="/login">Log in</a></div>
            <div style="margin-top: 8px; font-size: 12px; color: #888;">Public registration creates a customer account.</div>
        </div>
    </div>
</div>
